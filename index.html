<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Texto Circular con Estrellas</title>
    <link rel="stylesheet" href="estyle.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <h1 style="color: white; text-align: center; margin-bottom: 20px;">Texto Circular con Estrellas</h1>
    <p style="color: white; text-align: center; margin-bottom: 30px;">Si ves este texto, el sitio está funcionando correctamente</p>
    
    <!-- HTML: Agrega este div donde quieras el texto circular -->
    <div class="circular-text" 
         data-text="* DISEÑO Y DESARROLLO WEB PERSONALIZADO " 
         data-size="400" 
         data-color="#00ff88" 
         data-speed="20"
         data-font-size="14"
         data-separator=" "
         data-spacing="1.2"
         data-separator-mode="auto"
         data-manual-text="DISEÑO * Y * DESARROLLO * WEB * PERSONALIZADO">
        
        <!-- SVG estático como respaldo -->
        <svg width="400" height="400" viewBox="0 0 400 400" style="display: none;" id="fallback-svg">
            <circle cx="200" cy="200" r="170" fill="none" stroke="#333" stroke-width="1"/>
            <path id="fallback-path" d="M 30,200 A 170,170 0 1,1 370,200 A 170,170 0 1,1 30,200" fill="none"/>
            <text font-size="16" font-family="Poppins, sans-serif" fill="#00ff88" style="animation: rotateText 20s linear infinite; transform-origin: center;">
                <textPath href="#fallback-path">
                    * DISEÑO Y DESARROLLO WEB PERSONALIZADO * DISEÑO Y DESARROLLO WEB PERSONALIZADO * DISEÑO Y DESARROLLO WEB PERSONALIZADO *
                </textPath>
            </text>
        </svg>
    </div>
    
    <p style="color: #888; text-align: center; margin-top: 20px; font-size: 12px;">El círculo debería aparecer arriba</p>
    
    <script src="script.js"></script>
</body>
</html>
